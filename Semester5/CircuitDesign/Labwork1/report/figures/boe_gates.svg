<svg xmlns="http://www.w3.org/2000/svg" width="400" height="220" viewBox="0 0 400 220" font-family="DejaVu Sans, sans-serif" font-size="15">
  <rect width="400" height="220" fill="white"/>
  <g stroke="black" stroke-width="1.6" fill="none">
    <!-- sel, inverter, branch to the y1 gate -->
    <line x1="30" y1="45" x2="100" y2="45"/>
    <rect x="100" y="25" width="34" height="40"/>
    <circle cx="138" cy="45" r="4"/>
    <line x1="142" y1="45" x2="230" y2="45"/>
    <polyline points="70,45 70,185 230,185"/>
    <!-- d with branches to both gates -->
    <line x1="30" y1="120" x2="170" y2="120"/>
    <polyline points="170,120 170,75 230,75"/>
    <polyline points="170,120 170,155 230,155"/>
    <!-- AND gates -->
    <rect x="230" y="30" width="50" height="60"/>
    <rect x="230" y="140" width="50" height="60"/>
    <line x1="280" y1="60" x2="350" y2="60"/>
    <line x1="280" y1="170" x2="350" y2="170"/>
  </g>
  <circle cx="70" cy="45" r="3.5" fill="black"/>
  <circle cx="170" cy="120" r="3.5" fill="black"/>
  <g fill="black">
    <text x="8" y="50">sel</text>
    <text x="12" y="125">d</text>
    <text x="117" y="51" text-anchor="middle">1</text>
    <text x="255" y="52" text-anchor="middle">&amp;</text>
    <text x="255" y="162" text-anchor="middle">&amp;</text>
    <text x="356" y="65">y0</text>
    <text x="356" y="175">y1</text>
    <text x="160" y="38" font-size="13">¬sel</text>
  </g>
</svg>
