<svg xmlns="http://www.w3.org/2000/svg" width="780" height="360" viewBox="0 0 780 360" font-family="DejaVu Sans, sans-serif" font-size="14">
  <rect width="780" height="360" fill="white"/>
  <!-- boe_param frame -->
  <rect x="110" y="15" width="300" height="300" fill="none" stroke="black" stroke-width="1" stroke-dasharray="6,4"/>
  <text x="260" y="34" text-anchor="middle" fill="black">boe_param #(WIDTH)</text>
  <g stroke="black" stroke-width="1.6" fill="none">
    <!-- elementary demultiplexers -->
    <rect x="210" y="50" width="80" height="55"/>
    <rect x="210" y="125" width="80" height="55"/>
    <rect x="210" y="230" width="80" height="55"/>
    <!-- d bits -->
    <line x1="150" y1="65" x2="210" y2="65"/>
    <line x1="150" y1="140" x2="210" y2="140"/>
    <line x1="150" y1="245" x2="210" y2="245"/>
    <!-- shared select -->
    <polyline points="20,300 198,300 198,90 210,90"/>
    <line x1="198" y1="165" x2="210" y2="165"/>
    <line x1="198" y1="270" x2="210" y2="270"/>
    <!-- outputs to the {y1, y0} bus -->
    <line x1="290" y1="65" x2="460" y2="65"/>
    <line x1="290" y1="90" x2="460" y2="90"/>
    <line x1="290" y1="140" x2="460" y2="140"/>
    <line x1="290" y1="165" x2="460" y2="165"/>
    <line x1="290" y1="245" x2="460" y2="245"/>
    <line x1="290" y1="270" x2="460" y2="270"/>
    <!-- register -->
    <rect x="540" y="110" width="90" height="130"/>
    <polyline points="500,345 500,200 540,200"/>
    <polyline points="520,345 520,225 540,225"/>
    <polyline points="540,192 548,200 540,208"/>
  </g>
  <g stroke="black" stroke-width="4" fill="none">
    <line x1="20" y1="160" x2="150" y2="160"/>
    <line x1="150" y1="60" x2="150" y2="250"/>
    <line x1="460" y1="60" x2="460" y2="275"/>
    <line x1="460" y1="150" x2="540" y2="150"/>
    <line x1="630" y1="150" x2="770" y2="150"/>
  </g>
  <g fill="black">
    <circle cx="198" cy="165" r="3.5"/>
    <circle cx="198" cy="270" r="3.5"/>
    <text x="20" y="152">d[WIDTH−1:0]</text>
    <text x="20" y="293">sel</text>
    <text x="155" y="61" font-size="12.5">d[0]</text>
    <text x="155" y="136" font-size="12.5">d[1]</text>
    <text x="153" y="241" font-size="12.5">d[W−1]</text>
    <text x="250" y="72" text-anchor="middle">DMX</text>
    <text x="250" y="147" text-anchor="middle">DMX</text>
    <text x="250" y="252" text-anchor="middle">DMX</text>
    <text x="250" y="90" text-anchor="middle" font-size="12.5">[0]</text>
    <text x="250" y="165" text-anchor="middle" font-size="12.5">[1]</text>
    <text x="250" y="270" text-anchor="middle" font-size="12.5">[W−1]</text>
    <text x="214" y="69" font-size="12">d</text>
    <text x="214" y="94" font-size="12">sel</text>
    <text x="214" y="144" font-size="12">d</text>
    <text x="214" y="169" font-size="12">sel</text>
    <text x="214" y="249" font-size="12">d</text>
    <text x="214" y="274" font-size="12">sel</text>
    <text x="286" y="69" font-size="12" text-anchor="end">y0</text>
    <text x="286" y="94" font-size="12" text-anchor="end">y1</text>
    <text x="286" y="144" font-size="12" text-anchor="end">y0</text>
    <text x="286" y="169" font-size="12" text-anchor="end">y1</text>
    <text x="286" y="249" font-size="12" text-anchor="end">y0</text>
    <text x="286" y="274" font-size="12" text-anchor="end">y1</text>
    <text x="300" y="61" font-size="12.5">y0[0]</text>
    <text x="300" y="86" font-size="12.5">y1[0]</text>
    <text x="300" y="136" font-size="12.5">y0[1]</text>
    <text x="300" y="161" font-size="12.5">y1[1]</text>
    <text x="300" y="241" font-size="12.5">y0[W−1]</text>
    <text x="300" y="266" font-size="12.5">y1[W−1]</text>
    <text x="250" y="212" text-anchor="middle" font-size="18">⋮</text>
    <text x="370" y="212" text-anchor="middle" font-size="18">⋮</text>
    <text x="466" y="140" font-size="12.5">{y1, y0}</text>
    <text x="585" y="130" text-anchor="middle">RG</text>
    <text x="585" y="104" text-anchor="middle" font-size="12.5">result_register</text>
    <text x="585" y="256" text-anchor="middle" font-size="12.5">#(2·WIDTH)</text>
    <text x="546" y="155" font-size="12.5">D</text>
    <text x="552" y="204" font-size="12.5">C</text>
    <text x="546" y="229" font-size="12.5">R</text>
    <text x="482" y="355" font-size="12">clk</text>
    <text x="524" y="355" font-size="12">rst</text>
    <text x="640" y="140" font-size="12">result[2W−1:0]</text>
  </g>
</svg>
